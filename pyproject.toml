[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ckdoffline"
version = "0.2.0"
description = "Offline ISPF-style editor for datasets on 3390 volume images: z/OS for ZD&T, MVS 3.8j on Hercules"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Henri / Mainframe Society" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["zdt", "zd&t", "z/os", "mvs", "mvs 3.8j", "hercules", "mainframe", "dasd", "ckd", "cckd", "3390", "ispf", "pds"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Emulators",
    "Topic :: System :: Filesystems",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ckdoffline = "ckdoffline.__main__:main"

[tool.setuptools.packages.find]
include = ["ckdoffline*"]

[tool.setuptools.package-data]
ckdoffline = ["web/*.html", "web/*.css", "web/*.js", "web/screens/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: long-running test (deselect with -m 'not slow')"]
